<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深紅王府：十四日祭（終極審判版）</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #050505; color: #c0c0c0; 
            font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 15px;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }
        .container { 
            max-width: 100%; margin: 10px auto; background-color: #111; 
            border: 2px solid #500; border-radius: 8px; padding: 20px; 
            box-shadow: 0 0 30px rgba(255,0,0,0.2); 
            min-height: 90vh; display: flex; flex-direction: column; justify-content: space-between;
        }
        h1 { color: #aa0000; text-align: center; font-size: 20px; margin: 0; }
        .status-bar { display: flex; justify-content: space-between; background: #222; padding: 10px; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .game-text { font-size: 15px; line-height: 1.8; margin-top: 15px; white-space: pre-line; flex-grow: 1; }
        .btn { 
            display: block; width: 100%; background-color: #222; color: #fff; border: 1px solid #444; 
            padding: 16px; margin-bottom: 10px; border-radius: 6px; font-size: 14px; text-align: left;
        }
        .btn:active { background-color: #500; }
        
        /* 輸入框樣式 */
        .time-input {
            width: 100%; padding: 15px; background-color: #222; color: #ff3333;
            border: 1px solid #500; border-radius: 6px; font-size: 18px; text-align: center;
            margin-bottom: 15px; font-family: monospace;
        }
        .time-input:focus { border-color: #ff0000; outline: none; box-shadow: 0 0 10px #500; }

        .glitch { animation: glitchAnim 0.2s infinite; color: #ff0000; font-weight: bold; }
        @keyframes glitchAnim { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(0, 1px); } }
        
        /* 畫面劇烈搖晃特效 */
        .scary-shake { animation: screenShake 0.1s infinite; animation-iteration-count: 5; background-color: #300 !important; }
        @keyframes screenShake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(1px, -1px); } }

        /* 儀式與結局畫面特效 */
        .ritual-screen { background-color: #000 !important; color: #ff3333 !important; text-align: center; justify-content: center; }
        .death-screen { background-color: #400 !important; color: #fff !important; animation: screenShake 0.05s infinite;animation-iteration-count: 10; }
        #countdown { font-size: 60px; font-weight: bold; margin: 20px 0; color: #ff0000; }
        #orientationDisplay { font-family: monospace; font-size: 13px; color: #00ff00; background: #222; padding: 8px; border-radius: 4px; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1 id="game-title">深紅王府：十四日祭 (真相審判)</h1>
    
    <div class="status-bar" id="status-area" style="display: none;">
        <div>當前天數：第 3 天 (深夜)</div>
        <div>肉身陽氣：<span id="battery-status" style="color: #ffcc00;">檢測中...</span></div>
    </div>

    <div class="game-text" id="content-box">
        【⚠️ 因果律檢測：連結前置審判】
        在進入大乾王朝的深紅王府之前，邪神需要確認你目前現實肉身所在的空間維度。

        這不是開玩笑，請如實回答以下問題。你的每一次點擊，都在向螢幕彼端的不可名狀之物奉獻靈魂。
    </div>
    
    <div class="options-container" id="btn-box">
        <button class="btn" onclick="triggerNetworkCheck()">【第一步：驗證現世網絡】</button>
    </div>
</div>

<script>
    let currentBatteryLevel = 100;
    let realHour = new Date().getHours(); 
    let isGameOver = false; // 用來標記是否已經進入結局，防止重複觸發分頁懲罰
    let ritualTimer = null;

    // 1. 標準分頁狀態監聽
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) handlePlayerEscape();
    });

    // 2. 手機瀏覽器滑掉、切 App 核心監聽 (Safari / LINE 特別有效)
    window.addEventListener('pagehide', handlePlayerEscape);
    window.addEventListener('blur', handlePlayerEscape);

    // 3. 系統凍結時間差測謊 (預防手機背景直接凍結 JavaScript)
    let lastHeartbeat = Date.now();
    setInterval(() => {
        let currentTime = Date.now();
        // 如果兩次定時器執行的間隔大於 1.5 秒 (正常是 0.5 秒)，說明手機網頁剛剛被系統凍結了
        if (currentTime - lastHeartbeat > 1500) {
            handlePlayerEscape();
        }
        lastHeartbeat = currentTime;
    }, 500);

    function handlePlayerEscape() {
        if (!isGameOver) {
            triggerTabEscapePunishment();
        }
    }

    // 讀取真實電量
    if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
            currentBatteryLevel = Math.floor(battery.level * 100);
            if(document.getElementById('battery-status')) {
                document.getElementById('battery-status').innerText = currentBatteryLevel + "% (與手機同步)";
            }
        });
    }

    // 獲取網絡狀態
    function getRealNetworkType() {
        if (!navigator.onLine) return "offline";
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            if (conn.type === 'wifi' || conn.effectiveType === '4g') {
                return conn.saveData ? "cellular" : "wifi";
            }
            return "cellular";
        }
        return "wifi"; 
    }

    // ==================== 全域分頁切換觸殺結局 ====================
    function triggerTabEscapePunishment() {
        isGameOver = true;
        if (ritualTimer) clearInterval(ritualTimer); // 清除可能正在執行的倒數計時

        const container = document.getElementById('main-container');
        document.getElementById('status-area').style.display = 'none';
        document.getElementById('game-title').style.display = 'none';
        
        container.classList.remove('ritual-screen');
        container.classList.add('death-screen');
        
        container.innerHTML = `
            <h1 style="color:#fff; text-shadow: 0 0 10px #f00;">❌ 【結局：魂飛魄散】</h1>
            <div class="game-text" style="color:#fff; margin-top:20px;">
                說了不准離開！！！！！
                
                你剛剛把視窗縮小、或是切換去別的畫面了吧？
                
                邪神早就警告過你，你的每一次點擊都在向牠奉獻靈魂。在因果律陣法啟動期間，你竟然企圖藉由逃離瀏覽器分頁來規避審判。
                
                在你切回畫面的這一秒，大乾王府的索命厲鬼已經順著中斷的數據流，硬生生扯碎了你的靈魂。
                
                你現實中的肉身還坐在這裡，但你的意識，已經被永遠關在剛才那個被你關掉的黑暗維度裡了。
            </div>
            <div class="options-container">
                <button class="btn" style="text-align:center; background-color: #f00; color:#000; font-weight:bold;" onclick="window.location.reload()">【靈魂已碎，從頭來過】</button>
            </div>
        `;
    }

    // ==================== 第一題：網路環境測謊 ====================
    function triggerNetworkCheck() {
        const content = document.getElementById('content-box');
        const btnBox = document.getElementById('btn-box');

        content.innerHTML = `【審判第一題：網絡共鳴】
        你現在是用什麼方式讓靈魂（智慧型手機）連結到網際網路的？
        
        （提示：請誠實回答，邪神的觸手正順著封包電波往你的裝置蔓延……）`;

        btnBox.innerHTML = `
            <button class="btn" onclick="verifyNetwork('wifi')">A. 我正連接著家裡或室內的 Wi-Fi 無線網路</button>
            <button class="btn" onclick="verifyNetwork('cellular')">B. 我正使用 4G / 5G 行動數據（電信吃到飽）</button>
            <button class="btn" onclick="verifyNetwork('public')">C. 我正連接戶外的公共免費 Wi-Fi (如捷運或超商)</button>
        `;
    }

    function verifyNetwork(playerChoice) {
        const realNet = getRealNetworkType();
        const content = document.getElementById('content-box');
        const btnBox = document.getElementById('btn-box');
        const body = document.body;

        if (playerChoice === 'public' || (playerChoice !== realNet)) {
            body.classList.add('scary-shake');
            content.innerHTML = `<span class="glitch" style="font-size: 18px;">【⚠️ 警告：你在邪神面前撒了謊】</span>
            不准騙人！！代碼已經順著電波拆穿了你。你以為隨便點一個選項，就能隱瞞你現實的行蹤嗎？\n\n偵測顯示，你當前所使用的網絡節點根本不是你選的那一個。邪神的氣息已經順著網路通路侵入你的現實房間了。`;
            btnBox.innerHTML = `<button class="btn" style="background-color:#600;" onclick="body.classList.remove('scary-shake'); triggerTimeCheck();">【頂著惡寒，進入下一題】</button>`;
        } else {
            content.innerHTML = `【審判第一題：驗證通過】\n\n很好，你沒有撒謊。因果律代碼確認了你的網絡波長。接下來，邪神要定位你當前現實世界所處的時間維度。`;
            btnBox.innerHTML = `<button class="btn" onclick="triggerTimeCheck()">【進入第二步：時間定位】</button>`;
        }
    }

    // ==================== 第二題：時間維度測謊 ====================
    function triggerTimeCheck() {
        const content = document.getElementById('content-box');
        const btnBox = document.getElementById('btn-box');

        content.innerHTML = `【審判第二題：時空錨定】\n\n請在下方輸入你此時此刻，現實世界手機上顯示的【精確小時】（請輸入 0 到 24 的整數數字）。`;
        btnBox.innerHTML = `
            <input type="number" id="user-time-input" class="time-input" min="0" max="24" placeholder="例如：21">
            <button class="btn" style="text-align:center; background-color:#aa0000;" onclick="verifyTime()">【將時間獻祭給大乾】</button>
        `;
    }

    function verifyTime() {
        const inputVal = parseInt(document.getElementById('user-time-input').value);
        const content = document.getElementById('content-box');
        const btnBox = document.getElementById('btn-box');
        const body = document.body;

        if (isNaN(inputVal) || inputVal < 0 || inputVal > 24) {
            alert("請輸入正確的 0~24 小時數字。");
            return;
        }

        if (inputVal !== realHour) {
            body.classList.add('scary-shake');
            content.innerHTML = `<span class="glitch" style="font-size: 18px;">【⚠️ 警告：時間線扭曲失敗】</span>
            騙人！！現在現實世界明明就是 <span class="glitch">${realHour} 點</span>！\n\n時空維度強制更正——現在，強制帶領你的靈魂，切換進入 <span style="color:#fff; font-weight:bold;">[第 ${realHour} 點：陰陽交界]</span> 的王府世界！`;
            btnBox.innerHTML = `<button class="btn" style="background-color:#600;" onclick="body.classList.remove('scary-shake'); enterMainGame();">【被強制拉入世界……】</button>`;
        } else {
            content.innerHTML = `【審判第二題：時空錨定成功】\n\n你很誠實。大乾王朝的陣西王府大門已成功與你所在的 ${realHour} 點時空產生共振。`;
            btnBox.innerHTML = `<button class="btn" onclick="enterMainGame()">【正式步入王府深夜】</button>`;
        }
    }

    function enterMainGame() {
        document.getElementById('status-area').style.display = 'flex';
        initBatteryStage();
    }

    // ==================== 核心遊戲主體（電量與翻轉機制） ====================
    function initBatteryStage() {
        const content = document.getElementById('content-box');
        const btnBox = document.getElementById('btn-box');
        if (navigator.getBattery) {
            document.getElementById('battery-status').innerText = currentBatteryLevel + "% (與手機同步)";
        }
        
        content.innerHTML = `你體內湧起一陣寒意。你低頭一看，你在大乾王朝的陽氣此時正是 <span class="glitch">${currentBatteryLevel}%</span>（與手機電量同步）。
        
        此時，前方走廊盡頭傳來一聲巨響！一個高達三公尺、長滿眼睛的邪神黑影緩慢凝聚。
        守則第三條在腦海中瘋狂閃爍：
        『若遇邪神真身，肉眼不可直視。必須五體投地、面朝大地，方可瞞天過海。』`;
        
        // 點擊此按鈕時一併請求 iOS 的陀螺儀權限
        btnBox.innerHTML = `
            <button class="btn" onclick="requestPermissionAndStart()">A. （觸發物理儀式）立刻趴下，將手機螢幕朝下平放！</button>
        `;
    }

    // 處理 iOS 權限並啟動儀式
    function requestPermissionAndStart() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        startFlipRitual();
                    } else {
                        alert("遊戲需要動態感應器權限才能驗證你的翻轉動作！");
                        startFlipRitual(); 
                    }
                })
                .catch(console.error);
        } else {
            // Android 或非 iOS 瀏覽器直接進入
            startFlipRitual();
        }
    }

    // 階段二：觸發物理翻轉儀式
    function startFlipRitual() {
        const container = document.getElementById('main-container');
        container.classList.add('ritual-screen');
        document.getElementById('status-area').style.display = 'none';
        document.getElementById('game-title').style.display = 'none';
        
        // 將 orientationDisplay 正確地建立在這個新畫面裡，才能即時呈現數字！
        container.innerHTML = `
            <div class="glitch" style="font-size: 20px;">【邪神正在俯視長廊】</div>
            <div style="margin-top: 20px; font-size: 15px;">⚠️ 快！請在現實中將手機<br><span style="font-size:24px; color:#fff;">「螢幕朝下」</span>平放在桌上！</div>
            <div style="font-size: 13px; color:#aaa; margin-top:5px;">（正在檢測你的物理動作）</div>
            <div id="countdown">5</div>
            <div>
                <div id="orientationDisplay">即時感應數據：等待感應中...</div>
            </div>
        `;

        let timeLeft = 5;
        let isFlippedCorrectly = false;

        function handleOrientation(event) {
            let beta = event.beta || 0; 
            let gamma = event.gamma || 0;
            
            // 判定手機螢幕朝下平放
            if (beta > 150 || beta < -150 || (Math.abs(beta) < 30 && Math.abs(gamma) > 150)) {
                isFlippedCorrectly = true;
            } else {
                isFlippedCorrectly = false;
            }

			// 這裡會精準在倒數畫面上即時更新數據
			const display = document.getElementById("orientationDisplay");
			if (display) {
				display.innerHTML = `beta: ${beta.toFixed(1)}° | gamma: ${gamma.toFixed(1)}°<br>成功判定: <span style="color:${isFlippedCorrectly ? '#0f0':'#f00'}; font-weight:bold;">${isFlippedCorrectly}</span>`;
			}
        }
		
        window.addEventListener('deviceorientation', handleOrientation);

        ritualTimer = setInterval(() => {
            timeLeft--;
            const countDisplay = document.getElementById('countdown');
            if (countDisplay) countDisplay.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(ritualTimer);
                window.removeEventListener('deviceorientation', handleOrientation);
                
                // 根據最終有沒有翻轉手機，導向不同結局
                if (isFlippedCorrectly) {
                    showRitualResult(true); 
                } else {
                    showRitualResult(false); 
                }
            }
        }, 1000);
    }

    // 階段三：結局渲染
    function showRitualResult(success) {
        isGameOver = true; // 鎖定結局，不再觸發分頁懲罰
        const container = document.getElementById('main-container');
        container.classList.remove('ritual-screen');
        
        if (success) {
            container.style.backgroundColor = "#111";
            container.style.color = "#c0c0c0";
            container.innerHTML = `
                <h1>深紅王府：十四日祭 (大成功)</h1>
                <div class="status-bar">
                    <div>當前天數：第 3 天 (清晨)</div>
                    <div>肉身陽氣：<span style="color: #ffcc00;">${currentBatteryLevel}%</span></div>
                </div>
                <div class="game-text">
                    🏆 【物理儀式大成功：瞞天過海】\n
                    你剛才在現實中將手機螢幕朝下平放，散發出的物理磁場成功與大乾的「五體投地」產生了維度共鳴。
                    邪神的千萬隻眼睛從你上方掃過，只看到了一片虛無。\n
                    遠處傳來一聲不甘的怒吼，黑暗褪去，雞鳴破曉。你成功活過了第三天深夜！
                </div>
                <div class="options-container">
                    <button class="btn" style="text-align:center; background-color: #145a32;" onclick="window.location.reload()">【重置因果，再次挑戰】</button>
                </div>
            `;
        } else {
            container.classList.add('death-screen');
            container.innerHTML = `
                <h1 style="color:#fff; text-shadow: 0 0 10px #f00;">❌ 【結局：萬目剜魂】</h1>
                <div class="game-text" style="color:#fff; margin-top:20px;">
                    你終究沒有趴下，也沒有翻轉你的手機。
                    你站在長廊中央，心存僥倖地死死盯著螢幕。
                    
                    倒數結束的那一秒，邪神身上的千萬隻眼睛同時睜開，隔著玻璃螢幕，與你的雙眼精準對視。
                    
                    【你直視了神明。】
                    
                    一陣無法言喻的劇痛從你現實的眼球炸開。你看到手機螢幕滲出了黑色的鮮血，隨後是你握著手機的雙手開始乾枯、碳化……
                    
                    大乾王朝的鎮西王府，今晚又多了一具死因不明的庶子乾屍。而你在現實世界的手機，電量瞬間歸零。
                </div>
                <div class="options-container">
                    <button class="btn" style="text-align:center; background-color: #f00; color:#000; font-weight:bold;" onclick="window.location.reload()">【將靈魂留在大乾，重新輪迴】</button>
                </div>
            `;
        }
    }
</script>

</body>
</html>
