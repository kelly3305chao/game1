<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>⚡ 時空流速機關 ⚡</title>
    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            margin: 50px auto;
            width: 280px;
            height: 280px;
            background: #111;
            border: 2px solid #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,255,200,0.1);
        }
        /* 核心謎題字體 */
        #secret-core {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 5px;
            transition: color 0.1s;
        }
        .hint {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>⏳ 扭曲的時空矩陣 </h2>
    <p class="hint">
        「這裡的流速太快了，肉眼無法捕捉。<br>
        唯有讓你的核心**進入低能耗狀態**，時空才會慢下來...」
    </p>

    <div class="container">
        <div id="secret-core">WAIT</div>
    </div>

    <p class="hint" style="margin-top: 30px;">
        💡 提示：試著滑開手機控制中心，**開啟「省電模式」**（低電量模式）再回來看看。
    </p>

    <script>
        let lastTime = performance.now();
        let frameTimes = [];
        const secretEl = document.getElementById('secret-core');
        let toggle = false;

        function checkFPS(now) {
            // 計算兩幀之間的時間差 (毫秒)
            const delta = now - lastTime;
            lastTime = now;

            // 收集最近的幀率數據
            if (delta > 0) {
                frameTimes.push(1000 / delta);
                if (frameTimes.length > 10) frameTimes.shift();
            }

            // 計算平均 FPS
            const avgFPS = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;

            // --- 核心邏輯變更 ---
            // 如果偵測到平均 FPS 低於 75（代表成功降到 60Hz 或以下）
            if (avgFPS > 10 && avgFPS < 75) {
                // 解謎成功：停止閃爍，直接定格顯示密碼！
                secretEl.innerText = "OPEN";
                secretEl.style.color = "#00ffcc";
            } else {
                // 平時 120Hz 狀態：讓它瘋狂高速閃爍，融合成亂碼
                toggle = !toggle;
                if (toggle) {
                    secretEl.innerText = "OPEN";
                    secretEl.style.color = "#00ffcc";
                } else {
                    secretEl.innerText = "X X X";
                    secretEl.style.color = "#00ffcc";
                }
            }

            requestAnimationFrame(checkFPS);
        }

        // 啟動偵測
        requestAnimationFrame(checkFPS);
    </script>

</body>
</html>
