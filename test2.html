<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 陀螺儀方向訓練</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #050505;
            color: #c0c0c0;
            font-family: "Microsoft JhengHei", sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        h1 {
            color: #ffcc00;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .start-btn {
            background: linear-gradient(180deg, #ffcc00, #ff9900);
            border: none;
            border-radius: 50px;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 204, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 20px auto;
            display: block;
        }
        
        .start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 204, 0, 0.4);
        }
        
        .start-btn.hidden {
            display: none;
        }
        
        .target-sequence {
            background: #111;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 320px;
        }
        
        .sequence-title {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .sequence-steps {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .seq-item {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            background: #222;
            border: 2px solid #444;
            color: #555;
            transition: all 0.3s;
        }
        
        .seq-item.current {
            border-color: #ffcc00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            animation: pulse 1s infinite;
        }
        
        .seq-item.completed {
            background: #2a4a2a;
            border-color: #00ff00;
            color: #00ff00;
        }
        
        .seq-item.wrong {
            background: #4a2a2a;
            border-color: #ff4444;
            color: #ff4444;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .current-direction {
            background: #111;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 320px;
        }
        
        .direction-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .direction-arrow {
            font-size: 48px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .direction-text {
            font-size: 24px;
            font-weight: bold;
            color: #888;
        }
        
        .dir-up { color: #00ccff; }
        .dir-down { color: #ff6600; }
        .dir-right { color: #00ff00; }
        .dir-left { color: #ff00ff; }
        
        .angle-display {
            margin-top: 10px;
            font-family: monospace;
            font-size: 14px;
            color: #555;
        }
        
        .status-box {
            background: #111;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin: 20px auto;
            max-width: 320px;
        }
        
        .progress-bar {
            height: 20px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            border-radius: 10px;
            transition: width 0.3s;
        }
        
        .fail-progress .progress-fill {
            background: linear-gradient(90deg, #ff4444, #ff0000);
        }
        
        .status-text {
            font-size: 16px;
            color: #888;
        }
        
        .result-message {
            font-size: 32px;
            font-weight: bold;
            padding: 30px;
            margin: 20px auto;
            max-width: 320px;
            border-radius: 15px;
            display: none;
        }
        
        .result-success {
            color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            animation: glow-green 1s infinite;
            display: block;
        }
        
        .result-fail {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            border: 2px solid #ff4444;
            animation: glow-red 1s infinite;
            display: block;
        }
        
        @keyframes glow-green {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 0, 0.8); }
        }
        
        @keyframes glow-red {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 68, 68, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 68, 68, 0.8); }
        }
        
        .log-box {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 5px;
            padding: 10px;
            margin: 20px auto;
            max-width: 320px;
            height: 100px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 10px;
            color: #444;
        }
        
        .log-entry {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    
    <h1>🎯 陀螺儀方向訓練</h1>
    <p class="subtitle">依序傾斜手機：上 → 下 → 右 → 左</p>
    
    <!-- 開始按鈕 -->
    <button class="start-btn" id="start-btn">🎮 開始遊戲</button>
    
    <!-- 目標序列顯示 -->
    <div class="target-sequence" id="target-sequence" style="display:none;">
        <div class="sequence-title">目標順序</div>
        <div class="sequence-steps" id="sequence-steps">
            <div class="seq-item" data-dir="up">↑</div>
            <div class="seq-item" data-dir="down">↓</div>
            <div class="seq-item" data-dir="right">→</div>
            <div class="seq-item" data-dir="left">←</div>
        </div>
    </div>
    
    <!-- 目前方向 -->
    <div class="current-direction" id="current-direction" style="display:none;">
        <div class="direction-label">目前偵測方向</div>
        <div class="direction-arrow" id="direction-arrow">─</div>
        <div class="direction-text" id="direction-text">等待傾斜...</div>
        <div class="angle-display">
            Alpha: <span id="alpha-val">0</span>° | 
            Beta: <span id="beta-val">0</span>° | 
            Gamma: <span id="gamma-val">0</span>°
        </div>
    </div>
    
    <!-- 進度顯示 -->
    <div class="status-box" id="status-box" style="display:none;">
        <div class="status-text">目前進度: <span id="progress-count">0</span> / 4</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
        </div>
        <div class="status-text" style="margin-top:10px;">失敗次數: <span id="fail-count">0</span> / 4</div>
        <div class="progress-bar fail-progress">
            <div class="progress-fill" id="fail-fill" style="width: 0%;"></div>
        </div>
    </div>
    
    <!-- 結果訊息 -->
    <div class="result-message" id="result-message"></div>
    
    <!-- 日誌 -->
    <div class="log-box" id="log-box">
        <div class="log-entry">[系統] 等待開始遊戲</div>
    </div>
    
    <script>
        // ========== 遊戲狀態 ==========
        const TARGET_SEQUENCE = ['up', 'down', 'right', 'left'];
        let currentStep = 0;
        let failCount = 0;
        let gameStarted = false;
        let gameEnded = false;
        let lastDirection = null;
        let cooldownTimer = null;
        
        // 角度閾值
        const TILT_THRESHOLD = 25;
        
        // 元素
        const startBtn = document.getElementById('start-btn');
        const targetSequence = document.getElementById('target-sequence');
        const sequenceSteps = document.getElementById('sequence-steps');
        const currentDirection = document.getElementById('current-direction');
        const directionArrow = document.getElementById('direction-arrow');
        const directionText = document.getElementById('direction-text');
        const alphaVal = document.getElementById('alpha-val');
        const betaVal = document.getElementById('beta-val');
        const gammaVal = document.getElementById('gamma-val');
        const statusBox = document.getElementById('status-box');
        const progressCount = document.getElementById('progress-count');
        const progressFill = document.getElementById('progress-fill');
        const failCountEl = document.getElementById('fail-count');
        const failFill = document.getElementById('fail-fill');
        const resultMessage = document.getElementById('result-message');
        const logBox = document.getElementById('log-box');
        
        // 更新序列顯示
        function updateSequenceDisplay() {
            const items = sequenceSteps.querySelectorAll('.seq-item');
            items.forEach((item, index) => {
                item.classList.remove('current', 'completed', 'wrong');
                if (index < currentStep) {
                    item.classList.add('completed');
                } else if (index === currentStep) {
                    item.classList.add('current');
                }
            });
        }
        
        // 添加日誌
        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logBox.insertBefore(entry, logBox.firstChild);
            
            while (logBox.children.length > 20) {
                logBox.removeChild(logBox.lastChild);
            }
        }
        
        // 更新方向顯示
        function updateDirectionDisplay(direction) {
            const arrows = {
                'up': '↑',
                'down': '↓',
                'right': '→',
                'left': '←'
            };
            const texts = {
                'up': '向上傾斜',
                'down': '向下傾斜',
                'right': '向右傾斜',
                'left': '向左傾斜'
            };
            
            directionArrow.innerText = arrows[direction] || '─';
            directionText.innerText = texts[direction] || '等待傾斜...';
            directionText.className = 'direction-text dir-' + direction;
            directionArrow.className = 'direction-arrow dir-' + direction;
        }
        
        // 處理設備方向變化
        function handleOrientation(event) {
            if (!gameStarted || gameEnded) return;
            
            const alpha = event.alpha || 0; // Z軸旋轉 (指南針)
            const beta = event.beta || 0;   // X軸旋�� (前後傾斜)
            const gamma = event.gamma || 0; // Y軸旋轉 (左右傾斜)
            
            // 更新角度顯示
            alphaVal.innerText = Math.round(alpha);
            betaVal.innerText = Math.round(beta);
            gammaVal.innerText = Math.round(gamma);
            
            // 判斷傾斜方向
            let direction = null;
            
            if (Math.abs(beta) > TILT_THRESHOLD) {
                // Beta > 0 表示手機向前傾斜（頂部朝上）, Beta < 0 表示向後傾斜
                if (beta > TILT_THRESHOLD) {
                    direction = 'up';  // 向前傾斜 = 上
                } else if (beta < -TILT_THRESHOLD) {
                    direction = 'down';  // 向後傾斜 = 下
                }
            } else if (Math.abs(gamma) > TILT_THRESHOLD) {
                if (gamma > TILT_THRESHOLD) {
                    direction = 'right';  // 右傾斜
                } else if (gamma < -TILT_THRESHOLD) {
                    direction = 'left';   // 左傾斜
                }
            }
            
            // 如果偵測到新方向且不在冷卻時間
            if (direction && direction !== lastDirection && !cooldownTimer) {
                lastDirection = direction;
                updateDirectionDisplay(direction);
                
                // 冷卻時間，防止重複觸發
                cooldownTimer = setTimeout(() => {
                    lastDirection = null;
                    cooldownTimer = null;
                }, 800);
                
                // 檢查是否符合目標
                checkDirection(direction);
            }
        }
        
        // 檢查方向是否正確
        function checkDirection(direction) {
            const expectedDirection = TARGET_SEQUENCE[currentStep];
            
            if (direction === expectedDirection) {
                // 正確方向
                addLog(`✅ 正確: ${direction}`);
                currentStep++;
                progressCount.innerText = currentStep;
                progressFill.style.width = (currentStep / 4 * 100) + '%';
                updateSequenceDisplay();
                
                // 標记当前步骤为完成
                const items = sequenceSteps.querySelectorAll('.seq-item');
                if (currentStep < 4) {
                    items[currentStep - 1].classList.add('completed');
                }
                
                // 檢查是否完成
                if (currentStep >= 4) {
                    gameSuccess();
                }
            } else {
                // 錯誤方向
                addLog(`❌ 錯誤: ${direction} (期望: ${expectedDirection})`);
                failCount++;
                failCountEl.innerText = failCount;
                failFill.style.width = (failCount / 4 * 100) + '%';
                
                // 标记当前步骤为错误
                const items = sequenceSteps.querySelectorAll('.seq-item');
                if (items[currentStep]) {
                    items[currentStep].classList.add('wrong');
                    setTimeout(() => {
                        items[currentStep].classList.remove('wrong');
                    }, 500);
                }
                
                // 檢查是否失敗
                if (failCount >= 4) {
                    gameFail();
                }
            }
        }
        
        // 遊戲成功
        function gameSuccess() {
            gameEnded = true;
            addLog('🎉 遊戲成功！');
            resultMessage.innerText = '🎉 成功！';
            resultMessage.className = 'result-message result-success';
            startBtn.innerText = '🔄 再來一次';
            startBtn.classList.remove('hidden');
            
            // 停止監聽
            window.removeEventListener('deviceorientation', handleOrientation);
        }
        
        // 遊戲失敗
        function gameFail() {
            gameEnded = true;
            addLog('💥 遊戲失敗！');
            resultMessage.innerText = '💥 失敗！請重新開始';
            resultMessage.className = 'result-message result-fail';
            startBtn.innerText = '🔄 再來一次';
            startBtn.classList.remove('hidden');
            
            // 停止監聽
            window.removeEventListener('deviceorientation', handleOrientation);
        }
        
        // 初始化遊戲
        function initGame() {
            currentStep = 0;
            failCount = 0;
            gameStarted = true;
            gameEnded = false;
            lastDirection = null;
            
            if (cooldownTimer) {
                clearTimeout(cooldownTimer);
                cooldownTimer = null;
            }
            
            // 重置UI
            progressCount.innerText = '0';
            progressFill.style.width = '0%';
            failCountEl.innerText = '0';
            failFill.style.width = '0%';
            resultMessage.style.display = 'none';
            resultMessage.className = 'result-message';
            directionArrow.innerText = '─';
            directionText.innerText = '等待傾斜...';
            directionText.className = 'direction-text';
            
            // 顯示遊戲元素
            targetSequence.style.display = 'block';
            currentDirection.style.display = 'block';
            statusBox.style.display = 'block';
            
            updateSequenceDisplay();
            addLog('🚀 遊戲開始！請依序傾斜：上→下→右→左');
            
            // 請求設備方向權限並啟動
            requestOrientationPermission();
        }
        
        // 請求設備方向權限
        function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined') {
                // iOS 13+ 需要請求權限
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                addLog('[系統] 陀螺儀權限已授予');
                            } else {
                                addLog('[錯誤] 陀螺儀權限被拒絕');
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            addLog('[錯誤] ' + err.message);
                        });
                } else {
                    // 非 iOS 設備直接啟動
                    window.addEventListener('deviceorientation', handleOrientation);
                    addLog('[系統] 陀螺儀已啟動（非iOS）');
                }
            } else {
                addLog('[錯誤] 您的設備不支持陀螺儀');
            }
        }
        
        // 綁定開始按鈕
        startBtn.addEventListener('click', initGame);
        
        // 頁面載入完成
        addLog('[系統] 請點擊開始按鈕啟動遊戲');
        
        // 模擬模式（用於電腦測試）
        let simulatedDirection = null;
        let simIndex = 0;
        const simDirections = ['up', 'down', 'right', 'left'];
        
        // 鍵盤控制（僅用於電腦測試）
        document.addEventListener('keydown', function(e) {
            if (!gameStarted || gameEnded) return;
            
            const keyMap = {
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowRight': 'right',
                'ArrowLeft': 'left',
                'w': 'up',
                's': 'down',
                'd': 'right',
                'a': 'left'
            };
            
            const direction = keyMap[e.key];
            if (direction && !cooldownTimer) {
                lastDirection = direction;
                updateDirectionDisplay(direction);
                
                cooldownTimer = setTimeout(() => {
                    lastDirection = null;
                    cooldownTimer = null;
                }, 800);
                
                checkDirection(direction);
            }
        });
    </script>
</body>
</html>
